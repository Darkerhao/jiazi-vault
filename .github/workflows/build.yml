name: Build and release desktop apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release version
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v5

      - name: Audit dependencies before preparing a release
        run: pnpm audit:ci

      - name: Bump version and push release commit
        id: version
        run: node scripts/prepare-release.mjs

      - name: Generate release notes from commits
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" output/release-notes.md

      - name: Share release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: output/release-notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            platform: darwin-x86_64
            target: x86_64-apple-darwin
            bundles: dmg,app
          - os: macos-15
            platform: darwin-aarch64
            target: aarch64-apple-darwin
            bundles: dmg,app
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build Tauri packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: pnpm desktop:build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - name: Collect installers and signed updater metadata
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/collect-packages.mjs ${{ matrix.target }} ${{ matrix.platform }}
      - name: Verify native Windows release build
        if: runner.os == 'Windows'
        env:
          KEYSTILL_TEST_EXE: src-tauri/target/x86_64-pc-windows-msvc/release/keystill.exe
        run: node tests/desktop.mjs
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1
      - name: Upload verification reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-verification
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: keystill-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: output
      - uses: actions/download-artifact@v7
        with:
          pattern: keystill-*
          path: release
          merge-multiple: true
      - name: Assemble signed Tauri update manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/updater-manifest.mjs release "$RELEASE_TAG" output/release-notes.md
      - name: Publish packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Keystill $RELEASE_TAG" --notes-file output/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file output/release-notes.md --draft=false

  sync-dev:
    name: Sync release version to dev
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Cherry-pick release version commit into dev
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick --empty=drop "$RELEASE_COMMIT"
          git push origin HEAD:refs/heads/dev
