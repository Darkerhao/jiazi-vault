name: Build and release desktop apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release version
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v5

      - name: Audit dependencies before preparing a release
        run: pnpm audit:ci

      - name: Bump version and push release commit
        id: version
        run: node scripts/prepare-release.mjs

      - name: Generate release notes from commits
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" output/release-notes.md

      - name: Share release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: output/release-notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            extra_args: ''
          - os: macos-15-intel
            platform: mac
            arch: x64
            extra_args: --config.mac.identity=- --config.mac.hardenedRuntime=false
          - os: macos-15
            platform: mac
            arch: arm64
            extra_args: --config.mac.identity=- --config.mac.hardenedRuntime=false
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            extra_args: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Windows Hello build tools
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Run tests
        run: pnpm test

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: output

      - name: Build packages
        run: >-
          pnpm electron:build
          --${{ matrix.platform }} --${{ matrix.arch }}
          --publish never
          --config.electronDist=node_modules/electron/dist
          --config.releaseInfo.releaseNotesFile=output/release-notes.md
          ${{ matrix.extra_args }}

      - name: Verify Windows desktop flows
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: node tests/desktop.mjs

      - name: Verify Windows installer and upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query previous release' }
          $arguments = @{}
          if ($releases.Count -gt 0) {
            gh release download $releases[0].tagName --pattern 'keystill-*-win-x64.exe' --dir output/previous-release
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download previous Windows installer' }
            $installers = @(Get-ChildItem output/previous-release -Filter '*.exe')
            if ($installers.Count -ne 1) { throw 'Expected one previous Windows installer' }
            $arguments.BaselineInstaller = $installers[0].FullName
          }
          ./scripts/verify-windows-package.ps1 @arguments

      - name: Upload verification reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-verification
          path: |
            output/playwright/**/*.png
            output/playwright/**/*report*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: keystill-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.tar.gz
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: output

      - uses: actions/download-artifact@v7
        with:
          pattern: keystill-*
          path: release
          merge-multiple: true

      - name: Publish packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Keystill $RELEASE_TAG" --notes-file output/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file output/release-notes.md --draft=false

  sync-dev:
    name: Sync release version to dev
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Cherry-pick release version commit into dev
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick --empty=drop "$RELEASE_COMMIT"
          git push origin HEAD:refs/heads/dev
